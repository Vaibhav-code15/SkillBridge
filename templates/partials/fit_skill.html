<div class="fit-skill"><div class="fit-skill-main"><strong>{{ skill.name }}</strong><span class="badge">{{ skill.status|capfirst }}</span></div><div class="fit-levels"><div><small>Your level {{ skill.student_level }}/4</small><div class="proficiency" aria-label="Your proficiency {{ skill.student_level }} out of 4">{% for segment in '1234' %}<span class="{% if forloop.counter <= skill.student_level %}active{% endif %}"></span>{% endfor %}</div></div><div><small>Minimum {{ skill.minimum }}/4</small><div class="proficiency" aria-label="Required proficiency {{ skill.minimum }} out of 4">{% for segment in '1234' %}<span class="{% if forloop.counter <= skill.minimum %}active{% endif %}"></span>{% endfor %}</div></div></div><small>Weight {{ skill.weight }} ? {{ skill.points|floatformat:1 }} / {{ skill.possible|floatformat:1 }} points</small></div>
