<div class="fit-skill">
  <div class="fit-skill-main"><strong>{{ skill.name }}</strong><div class="proficiency" aria-label="Your proficiency {{ skill.student_level }} out of 4">{% for segment in '1234' %}<span class="{% if forloop.counter <= skill.student_level %}active{% endif %}"></span>{% endfor %}</div></div>
  <small>You {{ skill.student_level }}/4 · Minimum {{ skill.minimum }}/4 · Weight {{ skill.weight }} · Contribution {{ skill.points|floatformat:1 }}%</small>
</div>
